<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>音声認識テスト</title>

  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f3f6fa;
      text-align: center;
      margin: 0;
      padding: 40px 20px;
    }

    .container {
      max-width: 500px;
      margin: 0 auto;
      background: white;
      padding: 40px 25px;
      border-radius: 20px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.08);
    }

    h1 {
      font-size: 28px;
      margin-bottom: 10px;
    }

    .description {
      color: #555;
      margin-bottom: 30px;
    }

    #micButton {
      width: 180px;
      height: 180px;
      border-radius: 50%;
      border: none;
      background: #1976d2;
      color: white;
      font-size: 24px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 6px 15px rgba(0,0,0,0.2);
    }

    #micButton:hover {
      transform: scale(1.03);
    }

    #micButton.listening {
      background: #e53935;
    }

    .result-box {
      margin-top: 30px;
      padding: 20px;
      background: #eef5ff;
      border-radius: 12px;
      min-height: 70px;
    }

    #result {
      font-size: 24px;
      font-weight: bold;
      margin-top: 10px;
    }

    #status {
      margin-top: 20px;
      color: #666;
    }

    #error {
      margin-top: 20px;
      padding: 15px;
      color: #c62828;
      background: #ffebee;
      border-radius: 10px;
      display: none;
      white-space: pre-line;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>🎤 音声認識テスト</h1>

    <p class="description">
      出席番号を話してください
    </p>

    <button id="micButton" onclick="startRecognition()">
      🎤<br>話す
    </button>

    <p id="status">
      ボタンを押して話してください
    </p>

    <div class="result-box">
      <div>認識結果</div>
      <div id="result">---</div>
    </div>

    <div id="error"></div>

  </div>


<script>

let recognition = null;

function startRecognition() {

  const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

  const errorBox = document.getElementById("error");

  errorBox.style.display = "none";
  errorBox.textContent = "";

  // Web Speech APIに対応しているか確認
  if (!SpeechRecognition) {

    showError(
      "このブラウザは音声認識に対応していません。\n" +
      "Google Chromeで試してください。"
    );

    return;
  }


  recognition = new SpeechRecognition();

  recognition.lang = "ja-JP";

  recognition.interimResults = false;

  recognition.continuous = false;


  recognition.onstart = function() {

    const button = document.getElementById("micButton");

    button.classList.add("listening");

    button.innerHTML = "🔴<br>聞いています";

    document.getElementById("status").textContent =
      "話してください…";
  };


  recognition.onresult = function(event) {

    const transcript =
      event.results[0][0].transcript;

    document.getElementById("result").textContent =
      transcript;

    document.getElementById("status").textContent =
      "認識できました！";
  };


  recognition.onerror = function(event) {

    console.log("音声認識エラー:", event.error);

    showError(
      "音声認識エラー\n\n" +
      "エラー内容：" + event.error
    );
  };


  recognition.onend = function() {

    const button = document.getElementById("micButton");

    button.classList.remove("listening");

    button.innerHTML = "🎤<br>話す";
  };


  recognition.start();
}


function showError(message) {

  const errorBox =
    document.getElementById("error");

  errorBox.textContent = message;

  errorBox.style.display = "block";
}

</script>

</body>
</html>
