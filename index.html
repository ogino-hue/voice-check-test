<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>提出物 音声チェック</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 24px;
      background: #f2f5f9;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Noto Sans JP",
        sans-serif;

      color: #222;
    }

    .container {
      max-width: 680px;
      margin: 0 auto;
    }

    .card {
      background: white;

      border-radius: 24px;

      padding: 36px 28px;

      box-shadow:
        0 8px 28px
        rgba(0, 0, 0, 0.08);

      text-align: center;
    }

    h1 {
      margin: 0 0 10px;

      font-size: 30px;
    }

    .subtitle {
      margin-bottom: 28px;

      color: #666;

      font-size: 17px;
      line-height: 1.7;
    }


    /* =====================================
       マイク
    ===================================== */

    #micButton {
      width: 210px;
      height: 210px;

      border: none;
      border-radius: 50%;

      background: #1976d2;
      color: white;

      font-size: 28px;
      font-weight: bold;

      cursor: pointer;

      box-shadow:
        0 8px 20px
        rgba(0, 0, 0, 0.20);

      transition: 0.2s;
    }

    #micButton:hover {
      transform: scale(1.03);
    }

    #micButton:active {
      transform: scale(0.97);
    }

    #micButton.listening {
      background: #d32f2f;
    }


    /* =====================================
       状態表示
    ===================================== */

    #status {
      margin-top: 24px;

      min-height: 28px;

      font-size: 17px;

      color: #555;
    }


    /* =====================================
       認識結果
    ===================================== */

    .result-area {
      margin-top: 28px;

      padding: 22px;

      background: #eef5ff;

      border-radius: 16px;

      text-align: left;
    }

    .result-title {
      margin-bottom: 10px;

      text-align: center;

      font-size: 14px;

      color: #666;
    }

    #recognizedText {
      width: 100%;

      min-height: 80px;

      padding: 14px;

      border: 1px solid #c5d8f2;

      border-radius: 10px;

      background: white;

      font-size: 22px;
      font-weight: bold;

      text-align: center;

      resize: vertical;
    }

    .hint {
      margin-top: 8px;

      color: #777;

      font-size: 13px;

      text-align: center;
    }


    /* =====================================
       Apps Scriptへ進む
    ===================================== */

    #goButton {
      width: 100%;

      margin-top: 24px;

      padding: 18px;

      border: none;
      border-radius: 14px;

      background: #2e7d32;
      color: white;

      font-size: 20px;
      font-weight: bold;

      cursor: pointer;
    }

    #goButton:hover {
      opacity: 0.92;
    }

    #goButton:disabled {
      background: #bdbdbd;

      cursor: default;
    }


    /* =====================================
       やり直し
    ===================================== */

    #retryButton {
      width: 100%;

      margin-top: 10px;

      padding: 14px;

      border: none;
      border-radius: 12px;

      background: #eeeeee;
      color: #444;

      font-size: 16px;

      cursor: pointer;
    }


    /* =====================================
       エラー
    ===================================== */

    #error {
      display: none;

      margin-top: 20px;

      padding: 15px;

      border-radius: 12px;

      background: #ffebee;

      color: #b71c1c;

      white-space: pre-wrap;

      text-align: left;
    }


    @media (max-width: 600px) {

      body {
        padding: 14px;
      }

      .card {
        padding: 28px 18px;
      }

      h1 {
        font-size: 25px;
      }

      #micButton {
        width: 180px;
        height: 180px;

        font-size: 24px;
      }

      #recognizedText {
        font-size: 20px;
      }

    }

  </style>
</head>


<body>

<div class="container">

  <div class="card">

    <h1>
      🎤 提出物 音声チェック
    </h1>

    <div class="subtitle">
      提出した生徒の出席番号を<br>
      続けて話してください
    </div>


    <!-- マイク -->

    <button
      id="micButton"
      type="button"
      onclick="startRecognition()"
    >
      🎤<br>
      話す
    </button>


    <div id="status">
      例：1番、2番、3番、4番、5番
    </div>


    <!-- 認識結果 -->

    <div class="result-area">

      <div class="result-title">
        認識結果
      </div>

      <textarea
        id="recognizedText"
        placeholder="ここに認識結果が表示されます"
        oninput="updateGoButton()"
      ></textarea>

      <div class="hint">
        認識が違っていた場合は、ここで直接修正できます。
      </div>

    </div>


    <!-- Apps Scriptへ -->

    <button
      id="goButton"
      type="button"
      onclick="goToAppsScript()"
      disabled
    >
      📋 提出物チェックへ進む
    </button>


    <button
      id="retryButton"
      type="button"
      onclick="retryRecognition()"
    >
      ↻ もう一度話す
    </button>


    <div id="error"></div>

  </div>

</div>



<script>

  // =========================================================
  // Apps Script WebアプリURL
  // =========================================================

  const GAS_URL =
    "https://script.google.com/a/macros/tuhw-h.ed.jp/s/AKfycbwj1wz1TflZapmLS3BplXIH_ZQsCZ3P78SS0erMoJJYdPJM96JTfA4_Izn8DH6zM3T1/exec";


  // =========================================================
  // 音声認識
  // =========================================================

  let recognition = null;


  function startRecognition() {

    hideError();


    const SpeechRecognition =
      window.SpeechRecognition ||
      window.webkitSpeechRecognition;


    if (!SpeechRecognition) {

      showError(
        "このブラウザでは音声認識を利用できません。\n" +
        "Google Chromeで開いてください。"
      );

      return;
    }


    try {

      recognition =
        new SpeechRecognition();


      recognition.lang =
        "ja-JP";


      recognition.interimResults =
        false;


      recognition.continuous =
        false;


      const button =
        document.getElementById(
          "micButton"
        );


      const status =
        document.getElementById(
          "status"
        );


      recognition.onstart =
        function () {

          button
            .classList
            .add(
              "listening"
            );


          button.innerHTML =
            "🔴<br>聞いています";


          status.textContent =
            "番号を話してください…";

        };


      recognition.onresult =
        function (event) {

          const text =
            event
              .results[0][0]
              .transcript;


          document
            .getElementById(
              "recognizedText"
            )
            .value =
              text;


          status.textContent =
            "認識できました！";


          updateGoButton();

        };


      recognition.onerror =
        function (event) {

          console.error(
            "音声認識エラー:",
            event.error
          );


          let message =
            "音声認識に失敗しました。\n" +
            "エラー：" +
            event.error;


          if (
            event.error ===
            "not-allowed"
          ) {

            message =
              "マイクの使用が許可されていません。\n" +
              "Chromeの設定でマイクを許可してください。";

          }


          if (
            event.error ===
            "no-speech"
          ) {

            message =
              "音声を認識できませんでした。\n" +
              "もう一度話してください。";

          }


          showError(
            message
          );

        };


      recognition.onend =
        function () {

          button
            .classList
            .remove(
              "listening"
            );


          button.innerHTML =
            "🎤<br>話す";

        };


      recognition.start();


    } catch (error) {

      console.error(
        error
      );


      showError(
        "音声認識を開始できませんでした。\n\n" +
        error.message
      );

    }

  }



  // =========================================================
  // 「提出物チェックへ進む」ボタン
  // =========================================================

  function updateGoButton() {

    const text =
      document
        .getElementById(
          "recognizedText"
        )
        .value
        .trim();


    document
      .getElementById(
        "goButton"
      )
      .disabled =
        text === "";

  }



  // =========================================================
  // Apps Scriptへ移動
  // =========================================================

  function goToAppsScript() {

    hideError();


    const text =
      document
        .getElementById(
          "recognizedText"
        )
        .value
        .trim();


    if (!text) {

      showError(
        "出席番号が入力されていません。"
      );

      return;
    }


    const url =
      GAS_URL +
      "?spoken=" +
      encodeURIComponent(
        text
      );


    window.location.href =
      url;

  }



  // =========================================================
  // やり直し
  // =========================================================

  function retryRecognition() {

    document
      .getElementById(
        "recognizedText"
      )
      .value =
        "";


    document
      .getElementById(
        "status"
      )
      .textContent =
        "例：1番、2番、3番、4番、5番";


    updateGoButton();


    hideError();


    startRecognition();

  }



  // =========================================================
  // エラー
  // =========================================================

  function showError(message) {

    const error =
      document.getElementById(
        "error"
      );


    error.textContent =
      message;


    error.style.display =
      "block";

  }


  function hideError() {

    const error =
      document.getElementById(
        "error"
      );


    error.textContent =
      "";


    error.style.display =
      "none";

  }



  // =========================================================
  // 起動確認
  // =========================================================

  window.addEventListener(
    "DOMContentLoaded",
    function () {

      console.log(
        "提出物音声チェック 起動成功"
      );

      updateGoButton();

    }
  );

</script>


</body>

</html>
